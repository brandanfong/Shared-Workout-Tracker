# Alembic (database migrations). The database URL is NOT set here: it comes from
# DATABASE_URL, the same as the app (see alembic/env.py).
#
# The app applies migrations itself on startup. Day-to-day you only need:
#   .\venv\Scripts\alembic.exe revision --autogenerate -m "describe the change"

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
